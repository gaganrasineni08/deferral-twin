# --- Language model used by the app (src/llm_backend.py). Frozen; generation only. ---
llm:
  backend: auto              # auto | mlx | llamacpp | cuda | stub   (auto: mlx on Apple Silicon, llamacpp for a .gguf, cuda on a GPU)
  mlx_model: "mlx-community/Phi-3-mini-4k-instruct-4bit"   # the desktop app passes its downloaded copy
  cuda_model: "microsoft/Phi-3-mini-4k-instruct"
  max_new_tokens: 90

# --- Base model (Phase 1 scripts) ---
base_model: "meta-llama/Llama-3.1-8B-Instruct"
# fallback_model: "microsoft/Phi-3-mini-4k-instruct"

# --- Quantization ---
load_in_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_compute_dtype: "bfloat16"

# --- LoRA hyperparameters (Phase 2 only) ---
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

# --- Training (Phase 2 only) ---
training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  output_dir: "checkpoints/persona_lora"

# --- RAG ---
rag:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"   # stronger than MiniLM, better relevance judgment
  index_path: "data/processed/faiss_index.bin"
  top_k: 8                                    # more candidate facts per query (was 4)
  # Two-tier deferral instead of one hard cutoff:
  #   confidence < deferral_hard_floor            -> always defer, nothing relevant at all
  #   deferral_hard_floor <= confidence < deferral_similarity_threshold
  #                                                -> "soft" answer: attempt a grounded guess
  #                                                   using persona summary + weak matches,
  #                                                   flagged as lower-confidence
  #   confidence >= deferral_similarity_threshold  -> normal confident answer
  deferral_similarity_threshold: 0.35
  deferral_hard_floor: 0.15
  correction_boost: 0.05                      # ranking boost for facts the person corrected directly
  persona_summary_facts: 12    # how many early facts (demographics/personality) to use as always-on context

# --- Phase 1: public benchmark validation (Twin-2K-500) ---
benchmark:
  dataset_name: "LLM-Digital-Twin/Twin-2K-500"
  benchmark_dir: "data/benchmark/twin2k500"
  n_participants: 30
  config_name: "wave_split"   # "wave_split" or "full_persona"

# --- Paths ---
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  train_file: "data/processed/train.jsonl"
  qa_facts_file: "data/processed/qa_facts.jsonl"
